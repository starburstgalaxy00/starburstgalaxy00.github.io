<!DOCTYPE html>
<html lang="ko" dir="ltr">
<head>
    <meta charset="utf-8">
    <title>TimeTable</title>
    <style>
        * { padding: 0; margin: 0; }
        body {
            background-color: black;
            color: white;
            overflow: hidden;
            position: relative;
            width: 100vw;
            height: 100vh;
            font-family: 'Pretendard', sans-serif;
        }

        .container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100vh;
            height: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .rotate {
            transform: rotate(-90deg);
            transform-origin: center center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            width: 100%;
            height: 100%;
        }

        /* 텍스트 크기 및 스타일 */
        .fs1 { font-size: 8vh; font-weight: 600; line-height: 1.3; }
        .fs2 { font-size: 5vh; font-weight: 400; color: rgb(202, 202, 202); margin-top: 1vh; }
        
        /* 주의사항 박스 스타일 */
        .warning-box {
            border: 0.6vh solid yellow;
            padding: 3vh 5vh;
            border-radius: 30px;
            background-color: rgba(255, 255, 0, 0.05);
            margin-top: 3vh;
        }
        
        .fs3 { font-size: 4vh; font-weight: 500; line-height: 1.6; text-align: left; }

        /* 반짝이는 타이틀 */
        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }
        .blink-title {
            animation: blink 1.5s infinite;
            color: yellow;
            font-size: 5vh;
            font-weight: bold;
            display: block;
            text-align: center;
            margin-bottom: 1vh;
        }

        .highlight { color: yellow; }

        #close {
            background-color: #303030;
            position: fixed;
            top: 2%;
            right: 2%;
            padding: 10px 20px;
            border-radius: 10px;
            z-index: 100;
        }
        #close a { color: white; text-decoration: none; font-size: 3vh; font-weight: bold; }
    </style>
</head>

<body>
    <div id="container-bad" class="container" style="display:none">
        <div class="rotate">
            <div id="close"><a href="#" onclick="history.back(); return false;">닫기</a></div>
            <div class="fs1">날씨가 좋지 않아<br>관측을 할 수 없습니다.</div>
            <div class="fs2">Bad Weather Conditions<br> - Dome Closed -</div>
        </div>
    </div>

    <div id="container-good" class="container" style="display:none">
        <div class="rotate">
            <div id="close"><a href="#" onclick="history.back(); return false;">닫기</a></div>
            <div class="fs1">오른쪽으로 줄서서<br><span class="highlight">순서대로</span> 관측해 주세요.</div>
            <div class="fs2">Please Line Up Here</div>
            
            <div style="font-size:35vh; margin: -2vh 0;">→</div>

            <div class="warning-box">
                <span class="blink-title">※ 주의사항 (CAUTION)</span>
                <div class="fs3">
                    1. 망원경 잡지 않고 <span class="highlight">눈으로만</span> 관측<br>
                    2. 렌즈에 대고 <span class="highlight">촬영 금지</span><br>
                    3. <span class="highlight">플래시 사용 금지</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // URL 파라미터에서 값을 읽어오는 함수
            function getParameterByName(name) {
                const url = window.location.href;
                name = name.replace(/[\[\]]/g, '\\$&');
                var regex = new RegExp('[?&]' + name + '(=([^&#]*)|&|#|$)'),
                    results = regex.exec(url);
                if (!results) return null;
                if (!results[2]) return '';
                return decodeURIComponent(results[2].replace(/\+/g, ' '));
            }

            const condition = getParameterByName('condition');
            const containerBad = document.getElementById('container-bad');
            const containerGood = document.getElementById('container-good');

            // 파라미터 값에 따른 분기 처리
            if (condition === 'bad') {
                containerBad.style.display = 'flex';
                containerGood.style.display = 'none';
            } else {
                // 'good' 이거나 값이 없을 경우 기본값
                containerBad.style.display = 'none';
                containerGood.style.display = 'flex';
            }
        });
    </script>
</body>
</html>
