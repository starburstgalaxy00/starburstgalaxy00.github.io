<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>SolarCanvas - Pro</title>
    <style>
        body {
            margin: 0;
            display: flex;
            height: 100vh;
            background-color: #f0f0f0;
            overflow: hidden;
        }

        /* 왼쪽 이미지 영역 */
        .image-container {
            position: relative;
            width: 70vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
            border-right: 2px solid #333;
        }

        .image-container img {
            max-width: 95%;
            max-height: 95%;
            object-fit: contain;
        }

        .image-overlay-text {
            position: absolute;
            top: 5vh;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-family: 'Malgun Gothic', sans-serif;
            font-size: 2.0vw;
            font-weight: bold;
            text-align: center;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.8);
            pointer-events: none;
            z-index: 5;
        }

        /* 오른쪽 도화지 영역 (레이어 겹치기) */
        .canvas-container {
            position: relative;
            width: 30vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ddd;
        }

        /* 배경 캔버스 (태양/글자) */
        #bgCanvas {
            position: absolute;
            width: 95%;
            height: 95vh;
            background-color: white;
            border: 2px solid #333;
            z-index: 1;
        }

        /* 실제 그림을 그리는 캔버스 (투명) */
        #paintCanvas {
            position: absolute;
            width: 95%;
            height: 95vh;
            z-index: 2;
            touch-action: none;
            cursor: crosshair;
        }

        .toolbar {
            position: absolute;
            bottom: calc(2.5vh + 20px);
            left: calc(2.5% + 20px);
            right: calc(2.5% + 20px);
            display: flex;
            justify-content: space-between;
            z-index: 20;
        }

        .color-tools { display: flex; gap: 8px; }
        .canvas-btn { padding: 10px 15px; cursor: pointer; border: 1px solid #333; border-radius: 6px; font-weight: bold; font-size: 13px; }
        .btn-red { background-color: #ff0000; color: white; border: none; }
        .btn-black { background-color: #000000; color: white; border: none; }
        .btn-eraser { background-color: #ffffff; color: #333; border: 1px solid #333; }
        .reset-btn { background-color: #333; color: #fff; }
    </style>
</head>
<body>

    <div class="image-container">
        <div class="image-overlay-text">천문대에서 촬영한 태양</div>
        <img src="/images/sun.jpg" alt="태양 홍염 이미지">
    </div>

    <div class="canvas-container">
        <canvas id="bgCanvas"></canvas>
        <canvas id="paintCanvas"></canvas>

        <div class="toolbar">
            <div class="color-tools">
                <button class="canvas-btn btn-red" onclick="changeMode('red')">빨간 펜</button>
                <button class="canvas-btn btn-black" onclick="changeMode('black')">검은 펜</button>
                <button class="canvas-btn btn-eraser" onclick="changeMode('eraser')">지우개</button>
            </div>
            <button class="canvas-btn reset-btn" onclick="resetCanvas()">초기화</button>
        </div>
    </div>

    <script>
        const bgCanvas = document.getElementById('bgCanvas');
        const bgCtx = bgCanvas.getContext('2d');
        const paintCanvas = document.getElementById('paintCanvas');
        const paintCtx = paintCanvas.getContext('2d');
        
        let painting = false;
        let currentMode = 'red'; // red, black, eraser
        let penSize = 5;

        function drawBackground() {
            bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
            
            const centerX = bgCanvas.width / 2;
            const centerY = bgCanvas.height / 2;
            const baseSize = Math.min(bgCanvas.width, bgCanvas.height);
            const radius = (baseSize * 0.85) / 2;

            // 태양 원 그리기
            bgCtx.beginPath();
            bgCtx.arc(centerX, centerY, radius, 0, Math.PI * 2);
            bgCtx.fillStyle = "red"; 
            bgCtx.fill(); 
            bgCtx.closePath();

            // 상단 제목
            bgCtx.fillStyle = "#2c3e50";
            const fontSize = Math.max(bgCanvas.width * 0.04, 30); 
            bgCtx.font = `bold ${fontSize}px 'Malgun Gothic', sans-serif`;
            bgCtx.textAlign = "center";
            bgCtx.textBaseline = "top";
            bgCtx.fillText("오늘의 태양 홍염", bgCanvas.width * 0.5, bgCanvas.height * 0.05);
        }

        function changeMode(mode) {
            currentMode = mode;
            
            // 그리기 모드 초기화 (기본값: 겹쳐 그리기)
            paintCtx.globalCompositeOperation = 'source-over';
            
            if (mode === 'eraser') {
                penSize = 30; // 지우개는 크게
                paintCanvas.style.cursor = "cell";
                // 지우개 핵심: 그리는 부분을 투명하게 만듦
                paintCtx.globalCompositeOperation = 'destination-out';
            } else {
                penSize = 5;
                paintCanvas.style.cursor = "crosshair";
                const fill = mode === 'red' ? 'red' : 'black';
                paintCanvas.style.cursor = `url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 10 10"><circle cx="5" cy="5" r="4" fill="${fill}" stroke="white" stroke-width="1"/></svg>') 5 5, crosshair`;
            }
        }

        function initCanvas() {
            // 두 캔버스 크기 맞춤
            [bgCanvas, paintCanvas].forEach(cvs => {
                cvs.width = cvs.offsetWidth;
                cvs.height = cvs.offsetHeight;
            });
            
            drawBackground();
            changeMode(currentMode);
        }

        function startPosition(e) {
            painting = true;
            paintCtx.beginPath();
            const rect = paintCanvas.getBoundingClientRect();
            paintCtx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
        }

        function finishedPosition() {
            painting = false;
        }

        function draw(e) {
            if (!painting) return;
            const rect = paintCanvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            paintCtx.lineWidth = penSize;
            paintCtx.lineCap = 'round';
            paintCtx.lineJoin = 'round';
            
            // 지우개 모드일 때는 색상이 의미 없지만 모드에 맞춰 동작함
            paintCtx.strokeStyle = currentMode === 'eraser' ? 'rgba(0,0,0,1)' : currentMode; 

            paintCtx.lineTo(x, y);
            paintCtx.stroke();
        }

        function resetCanvas() {
            paintCtx.clearRect(0, 0, paintCanvas.width, paintCanvas.height);
        }

        window.addEventListener('resize', initCanvas);
        paintCanvas.addEventListener('mousedown', startPosition);
        paintCanvas.addEventListener('mouseup', finishedPosition);
        paintCanvas.addEventListener('mouseleave', finishedPosition);
        paintCanvas.addEventListener('mousemove', draw);

        // 터치 지원 (태블릿용)
        paintCanvas.addEventListener('touchstart', (e) => {
            const touch = e.touches[0];
            startPosition(touch);
        });
        paintCanvas.addEventListener('touchend', finishedPosition);
        paintCanvas.addEventListener('touchmove', (e) => {
            const touch = e.touches[0];
            draw(touch);
        });

        initCanvas();
    </script>
</body>
</html>
