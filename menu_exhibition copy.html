<!DOCTYPE html>
<html lang="ko" dir="ltr">
<head>
    <meta charset="utf-8">
    <title>menu</title>
    <style>
        * {
            padding: 0;
            margin: 0;
        }

        body {
            background-color: #F0F4F8; 
            color: #102A43; 
            overflow: hidden;
            position: absolute;
            width: 100%;
            height: 100%;
            font-family: 'Malgun Gothic', sans-serif;
        }

        .container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100vh;
            height: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .rotate {
            transform: rotate(-90deg);
            transform-origin: center center;
            display: flex;
            flex-direction: column;
            width: 100vh;
            height: 100vw;
        }

        /* ===== 새 레이아웃 ===== */
        .top-container {
            height: 70%;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;

            background-color: #000;
            color: #fff;

            border-bottom: 2px solid #BCCCDC;
        }

        .bottom-container {
            height: 30%;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #theme {
            position: absolute;
            top: 3%;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
        }

        #close {
            background-color: #486581;
            color: white;
            position: absolute;
            top: 2%;
            right: 2%;
            padding: 5px 10px;
        }

        #close a { color: white; text-decoration: none; }

        .fs-title { font-size: 5vw; font-weight: bold; }
        .fs-info1 { font-size: 1vw; }

        /* ===== 테이블 ===== */
        .timetable {
            border: none;
            width: 95%;
            /* height: 100%; */
            table-layout: fixed;
            border-collapse: collapse;
        }

        .timetable th, .timetable td {
            border: none;
            padding: 12px 8px;
            font-size: 1.0vw;
            text-align: center;
            vertical-align: middle;
        }

        .timetable th:nth-child(1), 
        .timetable td:nth-child(1) {
            width: 60%; 
        }

        .timetable th:nth-child(2), .timetable td:nth-child(2),
        .timetable th:nth-child(3), .timetable td:nth-child(3) {
            width: 20%;
        }

        .timetable th {
            background-color: #D9E2EC; 
            color: #102A43;
            font-weight: bold;
        }

        .category-divider {
            border-top: 3px solid #BCCCDC !important;
        }

        .timetable tbody tr:nth-child(even) {
            background-color: rgba(255, 255, 255, 0.3);
        }

        /* ===== 상단 콘텐츠 예시 ===== */
        .top-content {
            font-size: 4vw;
            font-weight: bold;
        }

    </style>
</head>

<body>
    <div class="container">
        <div class="rotate">

            <!-- 닫기 버튼 -->
            <div id="close">
                <a href="#" onclick="history.back(); return false;" class="fs-info1">닫기</a>
            </div>

            <!-- ===== 상단 70% ===== -->
            <div class="top-container">
                <div>
                    <div id="theme">
                        <div class="fs-title">계산하는 곳 →</div>
                    </div>
                    <div class="top-content">
                        🔹 여기에 새로운 콘텐츠 추가 🔹<br>
                        (공지, 이미지, 이벤트 등)
                    </div>
                </div>
            </div>

            <!-- ===== 하단 30% (기존 메뉴판) ===== -->
            <div class="bottom-container">
                <div id="timetable-container"></div>
            </div>

        </div>
    </div>

    <script>
        function loadCSV() {
            fetch('data/menu.csv')
                .then(response => response.text())
                .then(csvData => {
                    const lines = csvData.trim().split('\n');
                    if (lines.length <= 1) return;

                    const timetableContainer = document.getElementById('timetable-container');
                    timetableContainer.innerHTML = '';
                    
                    const timetable = document.createElement('table');
                    timetable.classList.add('timetable');

                    const thead = document.createElement('thead');
                    const headerRow = document.createElement('tr');
                    const headers = ['메뉴명', 'HOT', 'ICE']; 
                    headers.forEach(text => {
                        const th = document.createElement('th');
                        th.textContent = text;
                        headerRow.appendChild(th);
                    });
                    thead.appendChild(headerRow);
                    timetable.appendChild(thead);

                    const tbody = document.createElement('tbody');
                    const bodyLines = lines.slice(1);

                    let lastId = ""; 

                    bodyLines.forEach((line, index) => {
                        const values = line.split(',');
                        if (values.length >= 4) {
                            const currentId = values[0].trim();
                            const tr = document.createElement('tr');

                            if (index > 0 && lastId !== currentId) {
                                tr.classList.add('category-divider');
                            }
                            lastId = currentId;

                            for (let i = 1; i < 4; i++) {
                                const td = document.createElement('td');
                                td.innerHTML = values[i].trim().replace(/\[줄바꿈\]/g, '<br>');
                                tr.appendChild(td);
                            }
                            tbody.appendChild(tr);
                        }
                    });

                    timetable.appendChild(tbody);
                    timetableContainer.appendChild(timetable);
                })
                .catch(error => {
                    console.error('CSV 오류:', error);
                    document.getElementById('timetable-container').textContent = "메뉴 데이터를 불러올 수 없습니다.";
                });
        }

        window.onload = function () {
            loadCSV();
        }
    </script>
</body>
</html>
