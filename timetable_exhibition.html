<!DOCTYPE html>
<html lang="ko" dir="ltr">
<head>
    <meta charset="utf-8">
    <title>TimeTable</title>
    <style>
        * { padding: 0; margin: 0; }
        body {
            background-color: black;
            color: white;
            overflow: hidden;
            position: relative;
            width: 100vw;
            height: 100vh;
            font-family: 'Pretendard', sans-serif;
        }

        .container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100vh;
            height: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .rotate {
            transform: rotate(-90deg);
            transform-origin: center center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            width: 100%;
            height: 100%;
        }

        /* 텍스트 스타일 */
        .time { font-weight: bold; color: yellow; }
        .datetime { font-size: 60px; }
        .current { font-size: 60px; }
        .current-title { font-size: 120px; color: yellow; line-height: 1.2; }
        .alltimes { font-size: 40px; }
        .alltimes-title { font-size: 60px; }
        
        .datetime > p, .current > p { font-size: 40px; color: #adadad; }
        .alltimes > p { font-size: 32px; color: #adadad; }

        /* 여백 설정 */
        .pt-40 { padding-top: 40px; }
        .pt-200 { padding-top: 200px; }
        .pt-260 { padding-top: 260px; }
    </style>
</head>

<body>
    <div class="container">
        <div class="rotate">
            <div class="datetime">
                <div id="date"></div>
                <div id="time" class="time"></div>
            </div>

            <div class="current pt-260">
                <div>&lt; 운영 프로그램 &gt;</div>
                <p>&lt; Current Program &gt;</p>
                <div id="current_pg" class="pt-40 current-title"></div>
                <p id="current_pg_en"></p>
                <div id="current_pg_sub" class="pt-40"></div>
                <p id="current_pg_en_sub"></p>
            </div>

            <div class="alltimes pt-200">
                <div>&lt; 상시 관람 &gt;</div>
                <p>&lt; Open for viewing at all times &gt;</p>
                <div class="pt-40 alltimes-title">2층 전시실 </div>
                <p>2nd floor exhibition</p>
                <div class="pt-40">데스크에서 리플렛 받아가세요.</div>
                <p>Please pick up a leaflet at the desk.</p>
            </div>
        </div>
    </div>

    <script type="text/javascript">
        // 설정 변수
        const open_time = 14;
        const close_time = 22;

        // 텍스트 변수 (국문)
        const f1 = "1층 투영관";
        const f1_poetry_recitation = "1층 시낭송<br>(예약자 우선)";
        const f1_music_concert = "1층 음악회<br>(예약자 우선)";
        const f1_time = ":58 입장 마감 / 만 5세 이상";
        const f1_time_concert = ":58 예약자 입장 마감 / 만 7세 이상";
        const f3 = "3층 관측실";
        const f3_time1 = ":25 ~ ";
        const f3_time2 = ":45";
        const dinner = "저녁시간";
        const start = "프로그램<br>준비중입니다.";
        const start_sub = "조금만 기다려주세요.";
        const end = "프로그램이<br>종료되었습니다.";
        const end_sub = "다음에 또 만나요.";

        // 텍스트 변수 (영문)
        const en_f1 = "1st floor planetarium";
        const en_f1_poetry_recitation = "1st floor poetry recitation(Priority for reservations)";
        const en_f1_music_concert = "1st floor music concert(Priority for reservations)";
        const en_f1_time1 = "Last admission at ";
        const en_f1_time2 = ":58 / 5 years and older";
        const en_f1_time1_concert = "Last admission for reservation at ";
        const en_f1_time2_concert = ":58 / 7 years and older ";
        const en_f3 = "3rd floor observatory";
        const en_f3_time1 = ":25 ~ ";
        const en_f3_time2 = ":45";
        const en_dinner = "It's dinner time~";
        const en_start = "The program isn't prepared yet";
        const en_start_sub = "Please wait a moment!"
        const en_end = "The program has ended.";
        const en_end_sub = "See you again next time!"

        function setClock() {
            const date = new Date();
            const year = date.getFullYear();
            const month = date.getMonth() + 1;
            const day = date.getDate();
            const weekNames = ["일", "월", "화", "수", "목", "금", "토"];
            const week = weekNames[date.getDay()];
            const hour = date.getHours();
            const min = date.getMinutes();
            const sec = date.getSeconds();

            let current_pg = "", current_pg_sub = "", current_pg_en = "", current_pg_en_sub = "";

            // --- 저녁시간 설정 ---
            let dStartH, dStartM, dEndH, dEndM;
            if (month >= 10 || month <= 3) { // 동계 (10월~3월)
                dStartH = 17; dStartM = 25;
                dEndH = 18; dEndM = 25;
            } else { // 하계 (4월~9월)
                dStartH = 18; dStartM = 0;
                dEndH = 19; dEndM = 0;
            }

            const currentTotalMin = (hour * 60) + min;
            const dinnerStartTotal = (dStartH * 60) + dStartM;
            const dinnerEndTotal = (dEndH * 60) + dEndM;

            // --- 프로그램 판별 로직 (우선순위 중요) ---
            
            // 1. 개관 전
            if (hour < open_time) {
                current_pg = start;
                current_pg_sub = start_sub;
                current_pg_en = en_start;
                current_pg_en_sub = en_start_sub;
            }
            // 2. 운영 종료 (21:45 이후)
            else if (hour >= 22 || (hour == 21 && min > 45)) {
                current_pg = end;
                current_pg_sub = end_sub;
                current_pg_en = en_end;
                current_pg_en_sub = en_end_sub;
            }
            // 3. 저녁시간 (동계 기준 17:25부터 최우선 노출)
            else if (currentTotalMin >= dinnerStartTotal && currentTotalMin < dinnerEndTotal) {
                current_pg = dinner;
                current_pg_sub = dStartH + ":" + modifyNumber(dStartM) + " ~ " + dEndH + ":" + modifyNumber(dEndM);
                current_pg_en = en_dinner;
                current_pg_en_sub = dStartH + ":" + modifyNumber(dStartM) + " ~ " + dEndH + ":" + modifyNumber(dEndM);
            }
            // 4. 투영관 (매시 45분~58분)
            else if (min >= 45 && min <= 58) {
                if (week == "화" && hour == 19) {
                    current_pg = f1_poetry_recitation;
                    current_pg_sub = hour + f1_time_concert;
                    current_pg_en = en_f1_poetry_recitation;
                    current_pg_en_sub = en_f1_time1_concert + hour + en_f1_time2_concert;
                } else if (week == "토" && hour == 19) {
                    current_pg = f1_music_concert;
                    current_pg_sub = hour + f1_time_concert;
                    current_pg_en = en_f1_music_concert;
                    current_pg_en_sub = en_f1_time1_concert + hour + en_f1_time2_concert;
                } else {
                    current_pg = f1;
                    current_pg_sub = hour + f1_time;
                    current_pg_en = en_f1;
                    current_pg_en_sub = en_f1_time1 + hour + en_f1_time2;
                }
            }
            // 5. 그 외 모든 시간은 3층 관측실
            else {
                current_pg = f3;
                current_pg_sub = hour + f3_time1 + hour + f3_time2;
                current_pg_en = en_f3;
                current_pg_en_sub = hour + en_f3_time1 + hour + en_f3_time2;
            }

            // --- 화면 데이터 업데이트 ---
            document.getElementById("date").innerHTML = year + "/" + month + "/" + day + " (" + week + ")";
            document.getElementById("time").innerHTML = modifyNumber(hour) + ":" + modifyNumber(min) + ":" + modifyNumber(sec);
            document.getElementById("current_pg").innerHTML = current_pg;
            document.getElementById("current_pg_sub").innerHTML = current_pg_sub;
            document.getElementById("current_pg_en").innerHTML = current_pg_en;
            document.getElementById("current_pg_en_sub").innerHTML = current_pg_en_sub;
        }

        // 10보다 작은 숫자 앞에 0 붙이기
        function modifyNumber(time) {
            return parseInt(time) < 10 ? "0" + time : time;
        }

        // 초기 실행 및 1초마다 업데이트
        window.onload = function () {
            setClock();
            setInterval(setClock, 1000);
        }
    </script>
</body>
</html>
