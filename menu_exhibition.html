<!DOCTYPE html>
<html lang="ko" dir="ltr">
<head>
    <meta charset="utf-8">
    <title>menu</title>
    <style>
        * {
            padding: 0;
            margin: 0;
        }

        body {
            /* 미니멀 블루 배경색 및 네이비 글자색 */
            background-color: #F0F4F8; 
            color: #102A43; 
            overflow: hidden;
            position: absolute;
            width: 100%;
            height: 100%;
            font-family: 'Malgun Gothic', sans-serif;
        }

        .container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100vh;
            height: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .rotate {
            transform: rotate(-90deg);
            transform-origin: center center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            width: 100vh;
            height: 100vw;
        }

        #theme {
            position: fixed;
            transform: translate(-50%, 0);
            top: 3%;
            left: 50%;
            text-align: center;
            width: 90vh;
        }

        #close {
            background-color: #486581; /* 닫기 버튼 색상 변경 */
            color: white;
            position: fixed;
            transform: translate(-50%, 0);
            top: 0%;
            left: 96%;
            text-align: center;
            padding: 5px 10px;
        }
        
        #close a { color: white; text-decoration: none; }

        .fs-title { font-size: 5vw; font-weight: bold; }
        .fs-info1 { font-size: 1vw; }

        .timetable {
            position: fixed;
            top: 15vw;
            left: 2.5vh;
            border: none;
            width: 95vh;
            height: 84vw;
            table-layout: fixed;
            border-collapse: collapse;
        }

        /* 모든 셀 공통 스타일: 가운데 정렬 */
        .timetable th, .timetable td {
            border: none;
            padding: 12px 8px;
            font-size: 2.5vw;
            text-align: center; /* 텍스트 정중앙 정렬 */
            vertical-align: middle;
        }

        /* 1번째 열 (메뉴명): 비율 60% */
        .timetable th:nth-child(1), 
        .timetable td:nth-child(1) {
            width: 60%; 
        }

        /* 2, 3번째 열 (HOT, ICE): 비율 20% */
        .timetable th:nth-child(2), .timetable td:nth-child(2),
        .timetable th:nth-child(3), .timetable td:nth-child(3) {
            width: 20%;
        }

        /* 헤더 스타일: 미니멀 블루 톤 */
        .timetable th {
            background-color: #D9E2EC; 
            color: #102A43;
            font-weight: bold;
        }

        /* 카테고리 구분선: 연한 네이비 블루 */
        .category-divider {
            border-top: 3px solid #BCCCDC !important;
        }

        /* 홀수 줄 배경색 (선택사항: 가독성을 위해 살짝 추가) */
        .timetable tbody tr:nth-child(even) {
            background-color: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="rotate">
            <div id="theme">
                <div class="fs-title">계산하는 곳 →</div>
            </div>
            <div id="close">
                <a href="#" onclick="history.back(); return false;" class="fs-info1">닫기</a>
            </div>
            <div id="timetable-container"></div>
        </div>
    </div>

    <script>
        function loadCSV() {
            fetch('data/menu.csv')
                .then(response => response.text())
                .then(csvData => {
                    const lines = csvData.trim().split('\n');
                    if (lines.length <= 1) return;

                    const timetableContainer = document.getElementById('timetable-container');
                    timetableContainer.innerHTML = '';
                    
                    const timetable = document.createElement('table');
                    timetable.classList.add('timetable');

                    const thead = document.createElement('thead');
                    const headerRow = document.createElement('tr');
                    const headers = ['메뉴명', 'HOT', 'ICE']; 
                    headers.forEach(text => {
                        const th = document.createElement('th');
                        th.textContent = text;
                        headerRow.appendChild(th);
                    });
                    thead.appendChild(headerRow);
                    timetable.appendChild(thead);

                    const tbody = document.createElement('tbody');
                    const bodyLines = lines.slice(1);

                    let lastId = ""; 

                    bodyLines.forEach((line, index) => {
                        const values = line.split(',');
                        if (values.length >= 4) {
                            const currentId = values[0].trim();
                            const tr = document.createElement('tr');

                            // 카테고리가 바뀔 때 구분선 추가
                            if (index > 0 && lastId !== currentId) {
                                tr.classList.add('category-divider');
                            }
                            lastId = currentId;

                            for (let i = 1; i < 4; i++) {
                                const td = document.createElement('td');
                                // 데이터 정제 및 줄바꿈 처리
                                td.innerHTML = values[i].trim().replace(/\[줄바꿈\]/g, '<br>');
                                tr.appendChild(td);
                            }
                            tbody.appendChild(tr);
                        }
                    });

                    timetable.appendChild(tbody);
                    timetableContainer.appendChild(timetable);
                })
                .catch(error => {
                    console.error('CSV 오류:', error);
                    document.getElementById('timetable-container').textContent = "메뉴 데이터를 불러올 수 없습니다.";
                });
        }

        window.onload = function () {
            loadCSV();
        }
    </script>
</body>
</html>
