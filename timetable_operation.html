<!DOCTYPE html>

<style>
    * {
        padding: 0;
        margin: 0;
    }

    body {
        background-color: rgb(51, 51, 51);
        color: white;
        overflow: hidden;
        position: absolute;
        width: 100%;
        height: 100%;
    }


    .border {
        /*border: 2px solid red;*/
    }

    .border2 {
        border: 2px solid rgb(43, 255, 0);
    }

    .container {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 100vh; /* 주의! 회전할 거라서 vh, vw 바꿔야 함 */
        height: 100vw;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    #watch { /*시계 위치*/
        position: fixed;
        transform: translate(-50%,0);
        top: 0%;
        left: 6%;
    }

    #theme { /*제목 위치*/
       position: fixed;
       transform: translate(-50%,0);
       top: 3%;
       left: 50%;
       text-align: center;
       width: 90vh;
    }

    #close { /*닫기버튼 위치*/
        background-color: grey;
        color:white;
        position: fixed;
        transform: translate(-50%,0);
        top: 0%;
        left: 96%;
        text-align: center;
    }

    #info { /*관측대상정보*/
        position: fixed;
        top: 54%;
        width: 90vh;
        height: 45vw;
        text-align: left;
    }

    #info2 { /*하단정보*/
        position: fixed;
        top: 90%;
        width: 90vh;
        height: vw;
        font-size: 10vw;
        font-weight: bold;
        text-align: center;
    }

    .rotate { /* 회전 */
        transform: rotate(-90deg);
        transform-origin: center center;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        width: 100vh;
        height: 100vw;
    }

    .time {font-weight: bold; color: red;}

    .datetime {font-size: 60px;}

    .fs-info1 {font-size: 1vw;} /*시계, 오늘의관측대상*/
    .fs-info2 {font-size: 5vw;} /*설명*/
    .fs-subtitle {font-size: 1.8vw;} /*영어명,분류*/
    .fs-title {font-size: 5vw;} /*메인이름*/

    .datetime > p, .current > p {font-size: 40px; color: #adadad;}
    .alltimes > p {font-size: 32px; color: #adadad;}

    .pt-info2 {padding-top: 1vw;}
    .pt-200 {padding-top: 120px;}
    .pt-260 {padding-top: 260px;}

    .timetable {
        position: fixed;
        top: 15vw;
        left: 2.5vh;
        border: 1px solid #ccc;
        margin-top: px;
        width: 95vh;
        height: 70vw;
    }

    .timetable th, .timetable td {
        border: 1px solid #ccc;
        padding: 8px;
        text-align: center;
        font-size: 3vw;
    }

    @keyframes breathing {
        0%   { 
            opacity: 1;
            text-shadow: 0 0 5px yellow, 0 0 10px yellow;
        }
        50%  { 
            opacity: 0.6;
            text-shadow: 0 0 20px yellow, 0 0 40px yellow;
        }
        100% { 
            opacity: 1;
            text-shadow: 0 0 5px yellow, 0 0 10px yellow;
        }
    }

    .breathing {
        color: yellow !important;
        background-color: transparent !important; /* 🔥 배경 제거 */
        animation: breathing 2s infinite;
    }

</style>

<html lang="ko" dir="ltr">
    <head>
        <meta charset="utf-8">
        <title>timetable</title>
        
        <!-- 자동새로고침 -->
        <!-- <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="refresh" content="1800"> -->
    </head>

    <body>
        <div class="container">
            <div class="rotate">
                <!--시계-->
                <div id="watch" class="border">
                    <div class="datetime fs-info1">
                    <div id="date"></div>
                    <div id="time" class="time"></div>
                    </div>
                </div>
                <!--제목-->
                <div id="theme" class="border">
                    <div class="fs-title">운영시간표</div>
                </div>
                <!--닫기버튼-->
                <div id="close" class="border">
                    <a href="#" onclick="history.back(); return false;" class="fs-info1">닫기</a>
                </div>
                <!--프로그램정보-->
                <div id="timetable-container" class="border"></div>
                <!--하단정보-->
                <div id="info2" class="border">
                    <!-- <div class="fs-info2">＊ <span style="color:red; font-weight: bold;">만 5세 이상</span>부터 입장(시낭송, 음악회는 <span style="color:red; font-weight: bold;">만 7세 이상</span>)</div>
                    <div class="fs-info2">＊ 프로그램 시작하면 출입 절대 불가</div>
                    <div class="fs-info2">＊ 프로그램 시작하면 녹화 및 사진 촬영 불가</div> -->
                </div>
            </div>
        </div>
    </body>
</html>

<script>

function setClock() {
    var date = new Date();
    var year = date.getFullYear();
    var month = date.getMonth() + 1;
    var day = date.getDate();
    var weekNames = ["일", "월", "화", "수", "목", "금", "토"];
    var weekNames_en = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
    var week = weekNames[date.getDay()];
    var week_en = weekNames_en[date.getDay()];
    var hour = modifyNumber(date.getHours());
    var min = modifyNumber(date.getMinutes());
    var sec = modifyNumber(date.getSeconds());

    document.getElementById("date").innerHTML = year + "/" + month + "/" + day + " " + week;
    document.getElementById("time").innerHTML = hour + ":" + min + ":" + sec;
}

function getNowMinutes() {
    const now = new Date();
    return now.getHours() * 60 + now.getMinutes();
}

function timeToMinutes(t) {
    const [h, m] = t.split(':').map(Number);
    return h * 60 + m;
}

function modifyNumber(time) {
    if (parseInt(time) < 10) {
        return "0" + time;
    }
    else
        return time;
}

function loadCSV() {
    Promise.all([
        fetch('data/planetariumtable.csv').then(res => res.text()),
        fetch('data/mainobstable.csv').then(res => res.text())
    ])
    .then(([planetCsv, obsCsv]) => {

        function parseCSV(csv) {
            const lines = csv.trim().split('\n');
            const header = lines[0].split(',');
            return lines.slice(1).map(line => {
                const values = line.split(',');
                return header.reduce((obj, key, index) => {
                    obj[key] = values[index];
                    return obj;
                }, {});
            });
        }

        const planetData = parseCSV(planetCsv);
        const obsData = parseCSV(obsCsv);

        const currentMonth = new Date().getMonth() + 1;

        const planet = planetData.find(r => parseInt(r.month) === currentMonth);
        const obs = obsData.find(r => parseInt(r.month) === currentMonth);

        const container = document.getElementById('timetable-container');
        container.innerHTML = '';

        if (!planet || !obs) {
            container.textContent = '데이터 없음';
            return;
        }

        const timeMap = [
            { label: "2시", key: 15 },
            { label: "3시", key: 16 },
            { label: "4시", key: 17 },
            { label: "5시", key: 18 },
            { label: "6시", key: 19 },
            { label: "7시", key: 20 },
            { label: "8시", key: 21 },
            { label: "9시", key: 22 }
        ];

        const table = document.createElement('table');
        table.classList.add('timetable');

        const thead = document.createElement('thead');
        const tr = document.createElement('tr');

        ['시간', '천체투영관<br>[1층]', '관측실<br>[3층]', '전시실<br>[2층]'].forEach(h => {
            const th = document.createElement('th');
            th.innerHTML = h;
            tr.appendChild(th);
        });

        thead.appendChild(tr);
        table.appendChild(thead);

        const tbody = document.createElement('tbody');
        const nowMin = getNowMinutes();
        let totalRows = timeMap.length;

        timeMap.forEach((item, index) => {

            const pTime = planet[`${item.key -1}time`] || '';
            const pPro  = planet[`${item.key -1}pro`] || '';

            const oTime = obs[`${item.key}time`] || '';
            const oPro  = obs[`${item.key}pro`] || '';

            const row = document.createElement('tr');

            const timeCell = document.createElement('td');
            const plaCell = document.createElement('td');
            const obsCell = document.createElement('td');

            timeCell.textContent = item.label;

            // 🌟 천체투영관
            if (!pPro.includes('점검시간') && pTime) {
                const start = pTime.split('~')[0].trim();
                plaCell.textContent = start;

                const startMin = timeToMinutes(start);
                const highlightStart = startMin - 10;

                if (nowMin >= highlightStart && nowMin <= startMin - 2) {
                    plaCell.classList.add('breathing');
                }
            }

            // 🌟 관측실
            if (oPro !== '--' && oTime) {
                obsCell.innerHTML = oTime.replace(/\[줄바꿈\]/g, '<br>');

                const parts = oTime.split('~');
                if (parts.length === 2) {
                    const start = parts[0].trim();
                    const end = parts[1].trim();

                    const startMin = timeToMinutes(start);
                    const endMin = timeToMinutes(end);

                    if (nowMin >= startMin - 1 && nowMin <= endMin - 5) {
                        obsCell.classList.add('breathing');
                    }
                }
            }

            row.appendChild(timeCell);
            row.appendChild(plaCell);
            row.appendChild(obsCell);

            // 🌟 전시실 병합
            if (index === 0) {
                const exCell = document.createElement('td');
                exCell.textContent = '상시운영';
                exCell.setAttribute('rowspan', totalRows);
                row.appendChild(exCell);
            }

            tbody.appendChild(row);
        });

        table.appendChild(tbody);
        container.appendChild(table);

    })
    .catch(err => console.error(err));
}

function updateInfo2() {
    const now = new Date();

    const day = now.getDay(); // 0:일 ~ 6:토
    const nowMin = now.getHours() * 60 + now.getMinutes();

    const start = 19 * 60 + 30; // 19:30
    const end = 20 * 60;        // 20:00

    const info2 = document.getElementById('info2');

    // 기본 초기화
    info2.innerHTML = '';

    if (nowMin >= start && nowMin <= end) {
        if (day === 2) { // 화요일
            info2.innerHTML = `<div class="fs-info2 breathing">20시 시낭송회</div>`;
        } 
        else if (day === 6) { // 토요일
            info2.innerHTML = `<div class="fs-info2 breathing">20시 별음악회</div>`;
        }
    }
}

window.onload = function () {
    loadCSV();
    setClock();
    updateInfo2();

    setInterval(setClock, 1000);

    // 👉 1분마다 갱신
    setInterval(() => {
        loadCSV();
        updateInfo2();
    }, 60000);
}

</script>
