<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>menu</title>

<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
    background:#F0F4F8;
    color:#102A43;
    width:100%;
    height:100vh;
    overflow:hidden;
    font-family:'Malgun Gothic';
}

.container {
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    width:100vh; height:100vw;
}

.rotate {
    transform:rotate(-90deg);
    width:100%; height:100%;
    display:flex;
    flex-direction:column;
}

/* ===== 상단 ===== */
.top-container {
    flex:4;
    background:#243B53;
    color:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
}

#top-display {
    font-size:4vw;
    text-align:center;
    font-weight:bold;
}

.top-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.top-title {
    margin-bottom: 10vh;
    font-size: 3vw;
}

/* ===== 하단 ===== */
.bottom-container {
    flex:6;
    display:flex;
    flex-direction: column;
}

#timetable-container {
    width:100%;
    height:100%;
}

.timetable {
    width:100%;
    height:100%;
    table-layout:fixed;
    border-collapse:collapse;
}

.timetable thead { height:12%; }
.timetable tbody { height:88%; }

.timetable tbody tr { height:1%; }

.timetable th, .timetable td {
    text-align:center;
    padding:8px;
    font-size:2vw;
}

.timetable th {
    background:#D9E2EC;
    font-weight:bold;
}

.category-divider {
    border-top:3px solid #BCCCDC;
}

.timetable tbody tr:nth-child(even) {
    background:rgba(255,255,255,0.4);
}

.timetable th:nth-child(1),
.timetable td:nth-child(1) {
    width: 70%;   /* 메뉴명 넓게 */
}

.timetable th:nth-child(2),
.timetable td:nth-child(2),
.timetable th:nth-child(3),
.timetable td:nth-child(3) {
    width: 15%;   /* HOT / ICE */
}

.menu-title {
    width:100%;
    text-align:center;
    font-size:2.5vw;
    font-weight:bold;
    padding:1vh 0;
    background:#BCCCDC;
}

@keyframes goldBreathing {
    0% {
        opacity: 1;
        color: #FFD700;
        text-shadow: 
            0 0 5px #FFD700,
            0 0 10px #FFC300,
            0 0 20px #FFB000;
    }
    50% {
        opacity: 0.7;
        color: #FFE680;
        text-shadow: 
            0 0 20px #FFD700,
            0 0 40px #FFC300,
            0 0 60px #FFB000;
    }
    100% {
        opacity: 1;
        color: #FFD700;
        text-shadow: 
            0 0 5px #FFD700,
            0 0 10px #FFC300,
            0 0 20px #FFB000;
    }
}

.gold-breathing {
    animation: goldBreathing 2.5s infinite;
}
/* 닫기 */
#close {
    position:absolute;
    top:2%; right:2%;
    background:#486581;
    color:#fff;
    padding:5px 10px;
}

#close a { color:#fff; text-decoration:none; }

</style>
</head>

<body>

<div class="container">
<div class="rotate">

<div id="close">
<a href="#" onclick="history.back();return false;">닫기</a>
</div>

<!-- 상단 -->
<div class="top-container">
    <div class="top-wrapper">
        <div class="top-title"><운영 프로그램></div>
        <div id="top-display">로딩중...</div>
    </div>
</div>

<!-- 하단 -->
<div class="bottom-container">
    <div class="menu-title">카페메뉴판</div>
    <div id="timetable-container"></div>
</div>

</div>
</div>

<script>

/* =========================
   메뉴 로드
========================= */
function loadMenu() {
    fetch('data/menu.csv')
    .then(res => res.text())
    .then(csv => {

        const lines = csv.trim().split('\n');
        const container = document.getElementById('timetable-container');
        container.innerHTML = '';

        const table = document.createElement('table');
        table.className = 'timetable';

        const thead = document.createElement('thead');
        const tr = document.createElement('tr');

        ['메뉴명','HOT','ICE'].forEach(t=>{
            const th=document.createElement('th');
            th.textContent=t;
            tr.appendChild(th);
        });

        thead.appendChild(tr);
        table.appendChild(thead);

        const tbody=document.createElement('tbody');
        let lastId='';

        lines.slice(1).forEach((line,i)=>{
            const v=line.split(',');
            if(v.length<4) return;

            const tr=document.createElement('tr');

            if(i>0 && lastId!==v[0]) {
                tr.classList.add('category-divider');
            }
            lastId=v[0];

            for(let j=1;j<4;j++){
                const td=document.createElement('td');
                td.innerHTML=v[j].replace(/\[줄바꿈\]/g,'<br>');
                tr.appendChild(td);
            }

            tbody.appendChild(tr);
        });

        table.appendChild(tbody);
        container.appendChild(table);
    });
}

/* =========================
   상단 시간표 로직
========================= */
function loadTopDisplay() {
    Promise.all([
        fetch('data/planetariumtable.csv').then(r=>r.text()),
        fetch('data/mainobstable.csv').then(r=>r.text())
    ])
    .then(([pCsv,oCsv])=>{

        function parse(csv){
            const l=csv.trim().split('\n');
            const h=l[0].split(',');
            return l.slice(1).map(row=>{
                const v=row.split(',');
                return h.reduce((a,k,i)=>{
                    a[k]=v[i]; return a;
                },{});
            });
        }

        const pData=parse(pCsv);
        const oData=parse(oCsv);

        const m=new Date().getMonth()+1;

        const planet=pData.find(r=>+r.month===m);
        const obs=oData.find(r=>+r.month===m);

        updateTopDisplay(planet,obs);
    });
}

function updateTopDisplay(planet, obs) {

    const now = new Date();
    const nowMin = now.getHours()*60 + now.getMinutes();

    const display = document.getElementById('top-display');
    let message='';

    const timeMap=[15,16,17,18,19,20,21,22];

    const toMin=t=>{
        const [h,m]=t.split(':').map(Number);
        return h*60+m;
    };

    let firstStart = null;
    let lastEnd = null;

    for (let key of timeMap) {

        const pTime = planet[`${key-1}time`] || '';
        const pPro  = planet[`${key-1}pro`] || '';

        const oTime = obs[`${key}time`] || '';
        const oPro  = obs[`${key}pro`] || '';

        if (pTime && !pPro.includes('점검시간')) {
            const start = toMin(pTime.split('~')[0].trim());
            if (firstStart === null || start < firstStart) {
                firstStart = start;
            }
        }

        if (oTime && oPro !== '--') {
            const end = toMin(oTime.split('~')[1].trim());
            if (lastEnd === null || end > lastEnd) {
                lastEnd = end;
            }
        }
    }
    for(let key of timeMap){

        const pTime=planet[`${key-1}time`]||'';
        const pPro =planet[`${key-1}pro`]||'';

        const oTime=obs[`${key}time`]||'';
        const oPro =obs[`${key}pro`]||'';

        let pStart,oStart,oEnd;

        if(pTime){
            pStart=toMin(pTime.split('~')[0].trim());
        }

        if(oTime && oPro!=='--'){
            const s=oTime.split('~');
            oStart=toMin(s[0].trim());
            oEnd=toMin(s[1].trim());
        }

        /* 천체투영관 */
        if (!pPro.includes('점검시간') && pStart && oStart) {

            const showStart = oStart - 40;
            const showEnd   = pStart - 1;

            if (nowMin >= showStart && nowMin <= showEnd) {

                message = `
                    🪐 <span class="gold-breathing">천체투영관 </span>[1층]<br>
                    <span style="font-size:4vw; opacity:0.8;">
                        (${format(showStart)} ~ ${format(showEnd)} 입장)
                    </span>
                    <br>
                    <span style="font-size:2vw; color:red;">
                        만 5세 이상
                    </span>
                `;
                break;
            }
        }

        /* 관측실 */
        if (oPro !== '--' && pStart && oEnd) {

            const showStart = pStart - 1;
            const showEnd   = oEnd - 5;

            if (nowMin >= showStart && nowMin <= showEnd) {

                message = `
                    🔭 <span class="gold-breathing">천체관측실 </span>[3층]<br>
                    <span style="font-size:4vw; opacity:0.8;">
                        (${format(oStart)} ~ ${format(oEnd)})
                    </span>
                    <br>
                    <span style="font-size:2vw; color:red;">
                        45분 입장 마감
                    </span>
                `;
                break;
            }
        }

        /* 점검시간 */
        if (pPro.includes('점검시간') || oPro === '--') {

            message = `
                🌙 저녁시간<br>
                <span style="font-size:4vw; opacity:0.8;">
                    (운영 준비 중)
                </span>
            `;
        }
    }

    if (!message) {

        if (nowMin < firstStart) {
            message = `
                🌅 운영 준비 중<br>
                <span style="font-size:4vw; opacity:0.8;">
                    (곧 시작됩니다)
                </span>
            `;
        } 
        else if (nowMin > lastEnd) {
            message = `
                🌙 운영 종료<br>
                <span style="font-size:4vw; opacity:0.8;">
                    (내일 다시 운영됩니다)
                </span>
            `;
        } 
        else {
            message = `
                🌙 저녁시간<br>
                <span style="font-size:4vw; opacity:0.8;">
                    (운영 준비 중)
                </span>
            `;
        }
    }

    display.innerHTML = message;
}

function format(m){
    return `${Math.floor(m/60)}:${(m%60).toString().padStart(2,'0')}`;
}

/* =========================
   초기 실행
========================= */
function init(){
    loadMenu();
    loadTopDisplay();

    setInterval(()=>{
        loadTopDisplay();
    },60000);
}

window.onload=init;

</script>

</body>
</html>
