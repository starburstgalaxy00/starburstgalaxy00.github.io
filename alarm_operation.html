<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>menu</title>

<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
    background:#F0F4F8;
    color:#102A43;
    width:100%;
    height:100vh;
    overflow:hidden;
    font-family:'Malgun Gothic';
}

.container {
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    width:100vh; height:100vw;
}

.rotate {
    transform:rotate(-90deg);
    width:100%; height:100%;
    display:flex;
    flex-direction:column;
}

/* ===== 상단 ===== */
.top-container {
    flex:4;
    background:#243B53;
    color:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
}

#top-display {
    font-size:4vw;
    text-align:center;
    font-weight:bold;
}

.top-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.top-title {
    margin-bottom: 10vh;
    font-size: 3vw;
}

/* ===== 하단 ===== */
.bottom-container {
    flex:6;
    display:flex;
    flex-direction: column;
}

#timetable-container {
    width:100%;
    height:100%;
}

.timetable {
    width:100%;
    height:100%;
    table-layout:fixed;
    border-collapse:collapse;
}

.timetable thead { height:12%; }
.timetable tbody { height:88%; }

.timetable tbody tr { height:1%; }

.timetable th, .timetable td {
    text-align:center;
    padding:8px;
    font-size:2vw;
}

.timetable th {
    background:#D9E2EC;
    font-weight:bold;
}

.category-divider {
    border-top:3px solid #BCCCDC;
}

.timetable tbody tr:nth-child(even) {
    background:rgba(255,255,255,0.4);
}

.timetable th:nth-child(1),
.timetable td:nth-child(1) {
    width: 70%;   /* 메뉴명 넓게 */
}

.timetable th:nth-child(2),
.timetable td:nth-child(2),
.timetable th:nth-child(3),
.timetable td:nth-child(3) {
    width: 15%;   /* HOT / ICE */
}

.menu-title {
    width:100%;
    text-align:center;
    font-size:2.5vw;
    font-weight:bold;
    padding:1vh 0;
    background:#BCCCDC;
}

@keyframes goldBreathing {
    0% {
        opacity: 1;
        color: #FFD700;
        text-shadow: 
            0 0 5px #FFD700,
            0 0 10px #FFC300,
            0 0 20px #FFB000;
    }
    50% {
        opacity: 0.7;
        color: #FFE680;
        text-shadow: 
            0 0 20px #FFD700,
            0 0 40px #FFC300,
            0 0 60px #FFB000;
    }
    100% {
        opacity: 1;
        color: #FFD700;
        text-shadow: 
            0 0 5px #FFD700,
            0 0 10px #FFC300,
            0 0 20px #FFB000;
    }
}

.gold-breathing {
    animation: goldBreathing 2.5s infinite;
}
/* 닫기 */
#close {
    position:absolute;
    top:2%; right:2%;
    background:#486581;
    color:#fff;
    padding:5px 10px;
}

#close a { color:#fff; text-decoration:none; }

</style>
</head>

<body>

<div class="container">
<div class="rotate">

<div id="close">
<a href="#" onclick="history.back();return false;">닫기</a>
</div>

<!-- 상단 -->
<div class="top-container">
    <div class="top-wrapper">
        <div class="top-title"><운영 프로그램></div>
        <div id="top-display">로딩중...</div>
    </div>
</div>

<!-- 하단 -->
<div class="bottom-container">
    <div class="menu-title">카페메뉴판</div>
    <div id="timetable-container"></div>
</div>

</div>
</div>

<script>

/* =========================
   메뉴 로드
========================= */
function loadMenu() {
    fetch('data/menu.csv')
    .then(res => res.text())
    .then(csv => {

        const lines = csv.trim().split('\n');
        const container = document.getElementById('timetable-container');
        container.innerHTML = '';

        const table = document.createElement('table');
        table.className = 'timetable';

        const thead = document.createElement('thead');
        const tr = document.createElement('tr');

        ['메뉴명','HOT','ICE'].forEach(t=>{
            const th=document.createElement('th');
            th.textContent=t;
            tr.appendChild(th);
        });

        thead.appendChild(tr);
        table.appendChild(thead);

        const tbody=document.createElement('tbody');
        let lastId='';

        lines.slice(1).forEach((line,i)=>{
            const v=line.split(',');
            if(v.length<4) return;

            const tr=document.createElement('tr');

            if(i>0 && lastId!==v[0]) {
                tr.classList.add('category-divider');
            }
            lastId=v[0];

            for(let j=1;j<4;j++){
                const td=document.createElement('td');
                td.innerHTML=v[j].replace(/\[줄바꿈\]/g,'<br>');
                tr.appendChild(td);
            }

            tbody.appendChild(tr);
        });

        table.appendChild(tbody);
        container.appendChild(table);
    });
}

/* =========================
   상단 시간표 로직
========================= */
function loadTopDisplay() {
    Promise.all([
        fetch('data/planetariumtable.csv').then(r=>r.text()),
        fetch('data/mainobstable.csv').then(r=>r.text())
    ])
    .then(([pCsv,oCsv])=>{

        function parse(csv){
            const l=csv.trim().split('\n');
            const h=l[0].split(',');
            return l.slice(1).map(row=>{
                const v=row.split(',');
                return h.reduce((a,k,i)=>{
                    a[k]=v[i]; return a;
                },{});
            });
        }

        const pData=parse(pCsv);
        const oData=parse(oCsv);

        const m=new Date().getMonth()+1;

        const planet=pData.find(r=>+r.month===m);
        const obs=oData.find(r=>+r.month===m);

        updateTopDisplay(planet,obs);
    });
}

function updateTopDisplay(planet, obs) {

    const now = new Date();
    const nowMin = now.getHours()*60 + now.getMinutes();
    const display = document.getElementById('top-display');

    const toMin = t => {
        const [h,m] = t.split(':').map(Number);
        return h*60+m;
    };

    const format = m => `${Math.floor(m/60)}:${(m%60).toString().padStart(2,'0')}`;

    /* =========================
       🔥 모든 프로그램 배열화
    ========================= */
    const extractPrograms = (data, type) => {
        if (!data) return [];
        return Object.keys(data)
            .filter(k => k.includes('time'))
            .map(k => {
                const key = k.replace('time','');
                const time = data[k];
                const pro  = data[`${key}pro`] || '';

                if (!time) return null;

                const [start,end] = time.split('~').map(s=>s.trim());

                return {
                    type,
                    start: toMin(start),
                    end: toMin(end),
                    pro
                };
            })
            .filter(v => v !== null)
            .sort((a,b)=>a.start - b.start);
    };

    const pList = extractPrograms(planet, 'planet');
    const oList = extractPrograms(obs, 'obs');

    let message = '';

    /* =========================
       1️⃣ [우선순위 1] 절대 시간 기점 체크
    ========================= */
    if (nowMin < 14 * 60) { // 14시 이전
        message = `
            🌅 운영 준비 중<br>
            <span style="font-size:4vw; opacity:0.8;">
                (곧 시작됩니다)
            </span>
        `;
    } 
    else if (nowMin >= 21 * 60 + 45) { // 21시 45분 이후
        message = `
            🌙 운영 종료<br>
            <span style="font-size:4vw; opacity:0.8;">
                (내일 다시 운영됩니다)
            </span>
        `;
    }

    /* =========================
       2️⃣ [우선순위 2] 저녁시간 (점검시간 / --) 체크
    ========================= */
    if (!message) {
        // 천체관측실 프로그램 중 '--'에 해당하는 시간대인지 확인
        const isObsBreak = oList.some(o => o.pro === '--' && nowMin >= o.start && nowMin <= o.end);
        // 천체투영관 프로그램 중 '점검시간'이 포함된 시간대인지 확인
        const isPlanetBreak = pList.some(p => p.pro.includes('점검시간') && nowMin >= p.start && nowMin <= p.end);

        if (isObsBreak || isPlanetBreak) {
            message = `
                🌙 저녁시간<br>
                <span style="font-size:4vw; opacity:0.8;">
                    (운영 준비 중)
                </span>
            `;
        }
    }

    /* =========================
       3️⃣ [우선순위 3] 천체관측실 운영 시간 체크
    ========================= */
    if (!message) {
        for (let o of oList) {
            if (o.pro === '--') continue;

            const showStart = o.start;
            const showEnd   = o.end - 5; // 45분 입장 마감 반영

            if (nowMin >= showStart && nowMin <= showEnd) {
                message = `
                    🔭 <span class="gold-breathing">천체관측실</span> [3층]<br>
                    <span style="font-size:4vw; opacity:0.8;">
                        (${format(o.start)} ~ ${format(o.end)})
                    </span>
                    <br>
                    <span style="font-size:2vw; color:red;">
                        45분 입장 마감
                    </span>
                `;
                break;
            }
        }
    }

    /* =========================
       4️⃣ [우선순위 4] 천체투영관 입장 시간 체크
    ========================= */
    if (!message) {
        for (let i=0; i<pList.length; i++) {
            const p = pList[i];
            if (p.pro.includes('점검시간')) continue;

            // 바로 이전 관측 찾기
            const prevObs = oList
                .filter(o => o.end <= p.start)
                .sort((a,b)=>b.end - a.end)[0];

            if (!prevObs) continue;

            const showStart = prevObs.end;
            const showEnd   = p.start - 1;

            if (nowMin >= showStart && nowMin <= showEnd) {
                message = `
                    🪐 <span class="gold-breathing">천체투영관</span> [1층]<br>
                    <span style="font-size:4vw; opacity:0.8;">
                        (${format(showStart)} ~ ${format(showEnd)} 입장)
                    </span>
                    <br>
                    <span style="font-size:2vw; color:red;">
                        만 5세 이상
                    </span>
                `;
                break;
            }
        }
    }

    /* =========================
       5️⃣ [우선순위 5] 기본 Fallback (그 외 모든 시간)
    ========================= */
    if (!message) {
        message = `
            🏢 <span class="gold-breathing">전시실</span> [2층]<br>
            <span style="font-size:4vw; opacity:0.8;">
                (자유 관람 가능)
            </span>
        `;
    }

    display.innerHTML = message;
}

function format(m){
    return `${Math.floor(m/60)}:${(m%60).toString().padStart(2,'0')}`;
}

/* =========================
   초기 실행
========================= */
function init(){
    loadMenu();
    loadTopDisplay();

    setInterval(()=>{
        loadTopDisplay();
    },60000);
}

window.onload=init;

</script>

</body>
</html>
